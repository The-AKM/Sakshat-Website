{% extends 'sakshatro/index.html' %}
{% block login %}

<button id="rzp-button1">Pay</button>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_merchant_key }}", // Enter the Key ID generated from the Dashboard
    "amount": "{{ razorpay_amount }}", // Amount is in currency subunits. 
    "currency": "{{ currency }}",
    "name": "Sakshat RO", //your business name
    
    "order_id": "{{ razorpay_order_id }}", // This is a sample Order ID. Pass the `id` obtained in the response of Step 1
    "callback_url": "{{ callback_url }}",
    
    "prefill": { //We recommend using the prefill parameter to auto-fill customer's contact information especially their phone number
        "name": "{{ user.name }}", //your customer's name
        "email": "{{ user.email }}",
        "contact": "{{ user.contact_number }}" //Provide the customer's phone number for better conversion rates 
    },
    "notes": {
        "address": "Razorpay Corporate Office"
    },
    "theme": {
        "color": "#3399cc"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
    
}
</script>   

{% endblock %}
